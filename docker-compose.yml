services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: AI_incidence_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=AI_incidence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer
    container_name: AI_incidence_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
  ollama:
    image: ollama/ollama
    container_name: AI_incidence_ollama
    ports:
      - "11434:11434"
    volumes:
      - D:/Ollama/Models:/root/.ollama
volumes:
  pgdata:
